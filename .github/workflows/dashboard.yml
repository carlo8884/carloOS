name: dashboard-sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/**/page.tsx'
      - 'scripts/dashboard.mjs'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: write

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[skip dashboard]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/dashboard.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "carloos-stabilizer"
            git config user.email "stabilizer@carloos.local"
            git add DASHBOARD.md README.md
            git commit -m "chore(dashboard): sync page counts [skip dashboard]"
            git push
          fi
