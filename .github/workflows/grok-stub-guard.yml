name: GROK stub guard

# Pull requests fail "GROK.md stub guard" when GROK.md is a stub.
# Ruleset 24478557 blocks every direct push to main, including this
# workflow's token, so the push job only reports. It does not commit
# or push a restore.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: grok-stub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    name: GROK.md stub guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reject a stub GROK.md before merge
        run: node scripts/ci/content-stub-guard.mjs
      - name: Test the stub guard
        run: node --test scripts/ci/content-stub-guard.test.mjs scripts/ci/grok-direct-push-guard.test.mjs

  direct-push:
    if: github.event_name == 'push'
    name: GROK.md direct-push stub revert
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Report a stub GROK.md without pushing
        run: node scripts/ci/grok-direct-push-guard.mjs --report
