name: Amazon product sweep

# Weekly check of Amazon product hops and /go/amazon-brand/ searches.
# Non-blocking: this workflow is not a required check, and the scan exits 0.
# Findings go to the job summary and to the amazon-product-sweep artifact.
# This workflow does not open issues, assign, mention, or request review.

on:
  schedule:
    - cron: '30 16 * * 4'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: amazon-product-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Classifier tests
        run: node --test scripts/ci/amazon-product-sweep.test.mjs
      - name: Sweep Amazon product hops and searches
        run: node scripts/ci/amazon-product-sweep.mjs
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-product-sweep
          path: amazon-product-sweep.md
          if-no-files-found: ignore
          retention-days: 14
