name: content-quality

# Trust-guard: fails the PR if seo-audit or content-check counts INCREASE
# beyond the checked-in baseline at ops/quality-baseline.json.
# Existing issues do not force cleanup — only new regressions block.
# To accept a new baseline: node scripts/quality-guard.mjs --write-baseline

on:
  pull_request:
    branches: [main]

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Trust-guard
        run: node scripts/quality-guard.mjs
