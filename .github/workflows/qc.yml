name: QC

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Internal link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run link-check
        run: node scripts/ci/link-check.mjs
      - name: Earning-site internal links and hop slugs
        run: node scripts/ci/earning-site-links.mjs
      - name: Reject relative links to another site
        run: node scripts/ci/cross-site-links.mjs

  metadata-policy:
    name: Metadata policy (title ≤70, desc ≤160, no duplicates)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run metadata-policy
        run: node scripts/ci/metadata-policy.mjs

  sitemap-drift:
    name: Sitemap drift (indexable routes present in sitemap.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sitemap-drift
        run: node scripts/ci/sitemap-drift.mjs

  trust-guard:
    name: Trust-integrity guard (QC-STANDARDS.md §1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run trust-guard
        run: node scripts/ci/trust-guard.mjs

  orphan-check:
    name: Orphan-page detector (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run orphan-check
        run: node scripts/ci/orphan-check.mjs

  hub-spoke-check:
    name: Hub→spoke reciprocity (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hub-spoke-check
        run: node scripts/ci/hub-spoke-check.mjs

  schema-validate:
    name: JSON-LD schema validator (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run schema-validate
        run: node scripts/ci/schema-validate.mjs

  faq-schema-once:
    name: One FAQ schema when the page already builds it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run faq-schema-once
        run: node scripts/ci/faq-schema-once.mjs

  calculator-integrity:
    name: Calculator formula-constant integrity (tools-acceptance lock)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run calculator-integrity
        run: node scripts/ci/calculator-integrity.mjs

  kitchen-kit-ban:
    name: Kitchen-kit / fake-magnet copy ban (five earning sites)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run kitchen-kit-ban
        run: node scripts/ci/kitchen-kit-ban.mjs

  hop-topic-match:
    name: Amazon search matches page topic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hop-topic-match
        run: node scripts/ci/hop-topic-match.mjs && node --test scripts/ci/hop-topic-match.test.mjs && node scripts/ci/hop-species-match.mjs && node --test scripts/ci/hop-species-match.test.mjs && node scripts/ci/best-year-match.mjs && node --test scripts/ci/best-year-match.test.mjs

  tool-schema-coverage:
    name: Tool-page GEO schema coverage (SoftwareApplication + HowTo + FAQ)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tool-schema-coverage
        run: node scripts/ci/tool-schema-coverage.mjs

  hop-target:
    name: Hop targets and moved citations (no known 404 paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hop-target
        run: node scripts/ci/hop-target.mjs

  guide-faqs:
    name: Round 7, 9, and 11 guide FAQs match their schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run guide-faqs
        run: node scripts/ci/guide-faqs.mjs

  social-cards:
    name: Guide, tool, and comparison social cards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run social-cards
        run: node scripts/ci/social-cards.mjs

  price-as-of:
    name: Price figures carry their git as-of date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run price-as-of
        run: node scripts/ci/price-as-of.mjs

  price-stamp-age:
    name: Dollar figures are stamped within 120 days
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run price-stamp-age
        run: node scripts/ci/price-stamp-age.mjs && node --test scripts/ci/price-stamp-age.test.mjs

  stale-price-report:
    name: Prices older than 45 days (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run stale-price-report
        run: node scripts/ci/stale-price-report.mjs


  anti-truncation:
    name: Page and content files are not silently truncated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run anti-truncation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/ci/anti-truncation.mjs && node --test scripts/ci/anti-truncation.test.mjs

  cost-date-nearby:
    name: New care-cost sentences show their as-of date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cost-date-nearby
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/ci/cost-date-nearby.mjs && node --test scripts/ci/cost-date-nearby.test.mjs


  how-we-pick:
    name: How we pick pages and comparison last-updated dates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run how-we-pick
        run: node scripts/ci/how-we-pick.mjs

  score-creep:
    name: Editor score creep guard (five earning sites)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run score-creep guard
        run: node scripts/ci/score-creep-guard.mjs && node --test scripts/ci/score-creep-guard.test.mjs

  new-guide-sitemap:
    name: Round 7–8 guides in apex sitemap (no 404 or redirect chain)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run new-guide-sitemap
        run: node scripts/ci/new-guide-sitemap.mjs

  item-list:
    name: ItemList on comparison and best-of pages (no Review or AggregateRating)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run item-list
        run: node scripts/ci/item-list.mjs && node --test scripts/ci/item-list.test.mjs

  journey-events:
    name: Funnel events (calculator_complete, guide_signup_submit, hop_view)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run journey-events
        run: node scripts/ci/journey-events.mjs

  hop-attribution:
    name: Money-page hop attribution (site, source, partner, Amazon tag slot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run hop-attribution
        run: node scripts/ci/hop-attribution.mjs

  guide-tool-schema:
    name: Guide and tool Article + Breadcrumb schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run guide-tool-schema
        run: node scripts/ci/guide-tool-schema.mjs

  vercel-ignore:
    name: Vercel build-cost wrapper (dir-014 regression)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run vercel-ignore-test
        run: node scripts/ci/vercel-ignore-test.mjs

  a11y-pages:
    name: Accessibility on money pages and round 7–10 guides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run a11y-pages
        run: node scripts/ci/a11y-pages.mjs

  claim-audit:
    name: Money-page prices trace to a review card
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run claim-audit
        run: node scripts/ci/claim-audit.mjs

  content-stub-guard:
    name: Stub and placeholder guard (GROK.md, tools, guides)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run content-stub-guard
        run: node scripts/ci/content-stub-guard.mjs
      - name: Test content-stub-guard
        run: node --test scripts/ci/content-stub-guard.test.mjs scripts/ci/grok-direct-push-guard.test.mjs

  table-shop-links:
    name: Comparison table rows link to the existing shop hop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run table-shop-links
        run: node scripts/ci/table-shop-links.mjs

  disclosure-accuracy:
    name: Unconditional commission disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run disclosure-accuracy
        run: node scripts/ci/disclosure-accuracy.mjs

  insurance-registry-parity:
    name: Dog.com and Vets.co insurance registries match
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run insurance-registry-parity
        run: node scripts/ci/insurance-registry-parity.mjs && node --test scripts/ci/insurance-registry-parity.test.mjs
